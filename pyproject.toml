[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "graph-memory"
version = "0.1.0"
description = "Evidence-backed temporal memory over stateless MCP and direct Neo4j"
requires-python = ">=3.11"
dependencies = ["neo4j>=6,<7", "pydantic>=2.12,<3"]

[project.scripts]
graph-memory = "graph_memory.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["graph_memory", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an isolated Neo4j instance"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
