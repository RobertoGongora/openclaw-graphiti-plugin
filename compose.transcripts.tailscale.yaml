# Receiver overlay for compose.transcripts.yaml: other machines push transcripts
# into this graph over Tailscale; this host mounts none of their files.
#
#   docker compose --env-file /path/outside/repo/transcripts.env \
#     -f compose.transcripts.yaml -f compose.transcripts.tailscale.yaml up -d
#
# Requires Docker Compose 2.24.4 or later (the !override tags below).
# Compose reads the base file's required variables before this overlay removes
# the mounts that use them: set CLAUDE_SESSIONS_PATH and CODEX_SESSIONS_PATH to
# any placeholder, such as remote-push. The base file alone then fails to start,
# since a placeholder is not a path.
#
# Bolt is published on loopback and on the Tailscale address, never on 0.0.0.0
# or the LAN. The password is the Neo4j admin password: anyone who reaches the
# port with it can run any Cypher. Restrict the port with a tailnet policy; see
# docs/remote-push.md. MCP stays on loopback, as in the base file.
name: graph-memory-transcripts

services:
  neo4j:
    ports: !override
      - '127.0.0.1:27687:7687'
      - '${TAILSCALE_IP:?Set TAILSCALE_IP to this host''s Tailscale address}:27687:7687'
    environment:
      NEO4J_server_bolt_advertised__address: ${TAILSCALE_IP}:27687

  # Extraction only: every machine's own `graph-memory follow` stages its files.
  worker:
    command: [daemon, --source-records, --workers, '${TRANSCRIPT_WORKERS:-8}']
    volumes: !override
      - '${TRANSCRIPT_AUTH_PATH:?Set Codex authentication directory}:/home/memory/.codex'
    environment:
      # Other machines' feeds are unmatched here by design: with this set the worker
      # exits with code 2 if MEMORY_FEED_ACCEPT_UNMATCHED=1 reaches it.
      MEMORY_FEED_REMOTE_RECEIVER: '1'

  # Each pushing machine runs its own inventory against its own files.
  inventory:
    profiles: [disabled]
