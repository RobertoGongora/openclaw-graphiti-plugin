# Personal graph. Configuration comes from .env (see .env.example).
name: graph-memory

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# The image writes only to /tmp and to the mounted codex home.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-graph-memory: &graph-memory
  image: graph-memory:${GRAPH_MEMORY_TAG:-local}
  build:
    context: .
    target: production
    args:
      GIT_SHA: ${GIT_SHA:-unknown}
  restart: unless-stopped
  logging: *logging
  depends_on:
    neo4j:
      condition: service_healthy
      # A recreated database gets a new address; clients must reconnect to it.
      restart: true

x-neo4j-client: &neo4j-client
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set a Neo4j password}
  MEMORY_NAMESPACE: ${MEMORY_NAMESPACE:-personal}

services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26-community}
    restart: unless-stopped
    # The default 10 s ends in SIGKILL mid-checkpoint, then recovery on the next start.
    stop_grace_period: 2m
    logging: *logging
    # heap max + pagecache + JVM native overhead.
    mem_limit: ${MEMORY_NEO4J_MEM_LIMIT:-1536m}
    environment:
      # A volume created with NEO4J_AUTH=none takes this password on its first
      # authenticated start, but only if the default password was never changed;
      # afterwards the stored password wins and this value must match it.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set a Neo4j password}
      # `*` lets any page open in a local browser query the HTTP API.
      NEO4J_dbms_security_http__access__control__allow__origin: ${MEMORY_NEO4J_BROWSER_ORIGIN:-http://127.0.0.1:17474}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      # 0 waits forever, so one stuck lock holder wedges every writer.
      NEO4J_db_lock_acquisition_timeout: 60s
      NEO4J_db_transaction_timeout: 10m
      NEO4J_dbms_usage__report_enabled: 'false'
    ports:
      - '127.0.0.1:17687:7687'
    volumes:
      - graph_memory:/data
    healthcheck:
      # NEO4J_PASSWORD would be read by the image as a server setting, so the
      # password is derived from NEO4J_AUTH inside the container.
      test: ['CMD-SHELL', 'cypher-shell -a bolt://localhost:7687 -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1"']
      interval: 5s
      timeout: 5s
      retries: 30

  # Neo4j Browser/HTTP is published only on request:
  #   docker compose --profile browser up -d neo4j-browser
  neo4j-browser:
    profiles: [browser]
    image: alpine/socat@sha256:24220ef2c80a2a421ea08e4624488e985330c421b6aa3329bae14b0933a1d403
    <<: *hardening
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    pids_limit: 64
    command: ['TCP-LISTEN:7474,fork,reuseaddr', 'TCP:neo4j:7474']
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - '127.0.0.1:17474:7474'

  worker:
    <<: [*graph-memory, *hardening]
    # Must exceed 2 extraction attempts x 2 model attempts x MEMORY_LLM_TIMEOUT.
    stop_grace_period: 45m
    mem_limit: ${MEMORY_WORKER_MEM_LIMIT:-6g}
    pids_limit: 1024
    environment:
      <<: *neo4j-client
      HOME: /home/memory
      MEMORY_LLM: ${MEMORY_LLM:-codex}
      MEMORY_MODEL: ${MEMORY_MODEL:-gpt-5.6-terra}
      MEMORY_REASONING_EFFORT: ${MEMORY_REASONING_EFFORT:-low}
      MEMORY_LLM_URL: ${MEMORY_LLM_URL:-}
      MEMORY_LLM_API_KEY: ${MEMORY_LLM_API_KEY:-}
      MEMORY_LLM_TIMEOUT: ${MEMORY_LLM_TIMEOUT:-420}
      MEMORY_INTAKE_QUEUE: ${MEMORY_INTAKE_QUEUE:-32}
    command: [daemon, /bank, --workers, '${MEMORY_WORKERS:-4}']
    volumes:
      - type: bind
        source: ${MEMORY_BANK_PATH:-./memory-bank}
        target: /bank
        read_only: true
        bind:
          create_host_path: false
      - codex_auth:/home/memory/.codex
    healthcheck:
      test: ['CMD', 'graph-memory', 'health', '--role', 'worker']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mcp:
    <<: [*graph-memory, *hardening]
    mem_limit: 1g
    pids_limit: 256
    environment:
      <<: *neo4j-client
      MEMORY_LLM: caller
      MEMORY_HTTP_TOKEN: ${MEMORY_HTTP_TOKEN:?Set a private MCP bearer token in .env}
      # Extra Host names and browser Origins accepted besides loopback (comma lists).
      MEMORY_HTTP_HOSTS: ${MEMORY_HTTP_HOSTS:-}
      MEMORY_HTTP_ORIGINS: ${MEMORY_HTTP_ORIGINS:-}
    command: [serve, --transport, http, --host, 0.0.0.0]
    ports:
      - '127.0.0.1:${MEMORY_MCP_PORT:-8765}:8765'
    healthcheck:
      test: ['CMD', 'graph-memory', 'health', '--role', 'mcp']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  graph_memory:
    name: ${MEMORY_VOLUME:-graph-memory_graph_memory}
  codex_auth:
