name: graph-memory
services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_usage__report_enabled: 'false'
    ports:
      - '127.0.0.1:17687:7687'
      - '127.0.0.1:17474:7474'
    volumes:
      - graph_memory:/data
    healthcheck:
      test: ['CMD', 'cypher-shell', '-a', 'bolt://localhost:7687', 'RETURN 1']
      interval: 5s
      timeout: 5s
      retries: 30
  worker:
    build: .
    image: graph-memory:local
    init: true
    restart: unless-stopped
    stop_grace_period: 45m
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      HOME: /home/memory
      MEMORY_NAMESPACE: ${MEMORY_NAMESPACE:-personal}
      MEMORY_LLM: ${MEMORY_LLM:-codex}
      MEMORY_MODEL: ${MEMORY_MODEL:-gpt-5.6-terra}
      MEMORY_REASONING_EFFORT: ${MEMORY_REASONING_EFFORT:-low}
      MEMORY_LLM_URL: ${MEMORY_LLM_URL:-}
      MEMORY_LLM_API_KEY: ${MEMORY_LLM_API_KEY:-}
    command: [daemon, /bank, --workers, '${MEMORY_WORKERS:-4}']
    volumes:
      - type: bind
        source: ${MEMORY_BANK_PATH:-./memory-bank}
        target: /bank
        read_only: true
        bind:
          create_host_path: false
      - codex_auth:/home/memory/.codex
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  mcp:
    build: .
    image: graph-memory:local
    init: true
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    command: [serve, --transport, http, --host, 0.0.0.0]
    ports:
      - '127.0.0.1:8765:8765'
    environment:
      NEO4J_URI: bolt://neo4j:7687
      MEMORY_NAMESPACE: ${MEMORY_NAMESPACE:-personal}
      MEMORY_LLM: caller
      MEMORY_HTTP_TOKEN: ${MEMORY_HTTP_TOKEN:?Set a private MCP bearer token in .env}
volumes:
  graph_memory:
  codex_auth:
