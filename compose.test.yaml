# Ephemeral database for the integration tests: no auth, no persistence.
#   make test-db-up && MEMORY_TEST_NEO4J_URI=bolt://127.0.0.1:37687 uv run pytest
name: graph-memory-test
services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26-community}
    environment:
      # Loopback-only, holds nothing but fixtures, and has no HTTP port published.
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
      NEO4J_dbms_usage__report_enabled: 'false'
    ports:
      - '127.0.0.1:${MEMORY_TEST_NEO4J_PORT:-37687}:7687'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'cypher-shell', '-a', 'bolt://localhost:7687', 'RETURN 1']
      interval: 3s
      timeout: 5s
      retries: 40
